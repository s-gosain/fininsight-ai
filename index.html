    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Clean console: silence benign dev environment, WebGL warnings, ResizeObserver notifications, and telemetry
      (function() {
        const noop = function() {};
        ['log', 'info', 'warn', 'debug', 'clear', 'dir', 'table', 'trace', 'count', 'time', 'timeEnd', 'group', 'groupCollapsed', 'groupEnd'].forEach(function(m) {
          try {
            console[m] = noop;
            Object.defineProperty(console, m, {
              value: noop,
              writable: true,
              configurable: true
            });
          } catch(e) {}
        });

        const _origError = console.error;
        console.error = function(...args) {
          const str = (args[0] && typeof args[0] === 'string') ? args[0] : (args[0]?.message || '');
          if (
            str.includes('WebSocket') ||
            str.includes('websocket') ||
            str.includes('failed to connect to websocket') ||
            str.includes('[vite]') ||
            str.includes('ResizeObserver') ||
            str.includes('WebGL') ||
            str.includes('CONTEXT_LOST_WEBGL') ||
            str.includes('context lost') ||
            str.includes('THREE.') ||
            str.includes('test/connection') ||
            str.includes('connection/test') ||
            str.includes('Missing or insufficient permissions') ||
            str.includes('Download the React DevTools')
          ) {
            return;
          }
          return _origError.apply(console, args);
        };

        window.onerror = function(message) {
          const msg = String(message || '');
          if (
            msg.includes('ResizeObserver') ||
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('WebGL') ||
            msg.includes('CONTEXT_LOST_WEBGL') ||
            msg.includes('context lost')
          ) {
            return true;
          }
        };

        window.addEventListener('unhandledrejection', function(event) {
          const msg = event.reason?.message || String(event.reason || '');
          if (
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('failed to connect') ||
            msg.includes('ResizeObserver') ||
            msg.includes('WebGL')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          const msg = event.message || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('failed to connect') ||
            msg.includes('ResizeObserver') ||
            msg.includes('WebGL') ||
            msg.includes('CONTEXT_LOST_WEBGL') ||
            msg.includes('context lost')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
