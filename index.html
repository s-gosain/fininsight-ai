    <script>
      // Clean console: eliminate browser logs, dev server telemetry, Three.js notices, and React DevTools prompts
      (function() {
        var noop = function() {};
        var _origClear = (typeof console !== 'undefined' && typeof console.clear === 'function') ? console.clear.bind(console) : noop;

        // Disable all standard log, info, warn, debug methods to avoid spurious DevTools counter badges
        ['log', 'info', 'warn', 'debug', 'dir', 'table', 'trace', 'count', 'time', 'timeEnd', 'group', 'groupCollapsed', 'groupEnd'].forEach(function(m) {
          try {
            Object.defineProperty(console, m, {
              get: function() { return noop; },
              set: function() {},
              configurable: false
            });
          } catch(e) {
            try { console[m] = noop; } catch(_) {}
          }
        });

        try {
          Object.defineProperty(console, 'clear', {
            get: function() { return _origClear; },
            set: function() {},
            configurable: false
          });
        } catch(e) {}
        try { _origClear(); } catch(e) {}

        var _origError = (typeof console !== 'undefined' && console.error) ? console.error.bind(console) : noop;
        try {
          Object.defineProperty(console, 'error', {
            get: function() {
              return function() {
                var str = '';
                for (var i = 0; i < arguments.length; i++) {
                  var a = arguments[i];
                  str += ' ' + (typeof a === 'string' ? a : (a && a.message ? a.message : ''));
                }
                if (
                  str.indexOf('WebSocket') !== -1 ||
                  str.indexOf('websocket') !== -1 ||
                  str.indexOf('failed to connect') !== -1 ||
                  str.indexOf('[vite]') !== -1 ||
                  str.indexOf('ResizeObserver') !== -1 ||
                  str.indexOf('WebGL') !== -1 ||
                  str.indexOf('CONTEXT_LOST_WEBGL') !== -1 ||
                  str.indexOf('context lost') !== -1 ||
                  str.indexOf('THREE.') !== -1 ||
                  str.indexOf('test/connection') !== -1 ||
                  str.indexOf('Missing or insufficient permissions') !== -1 ||
                  str.indexOf('Download the React DevTools') !== -1
                ) {
                  return;
                }
                _origError.apply(console, arguments);
              };
            },
            set: function() {},
            configurable: false
          });
        } catch(e) {}

        window.onerror = function(message) {
          var msg = String(message || '');
          if (
            msg.indexOf('ResizeObserver') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('WebGL') !== -1 ||
            msg.indexOf('CONTEXT_LOST_WEBGL') !== -1 ||
            msg.indexOf('context lost') !== -1
          ) {
            return true;
          }
        };

        window.addEventListener('unhandledrejection', function(event) {
          var msg = event.reason && event.reason.message ? event.reason.message : String(event.reason || '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('failed to connect') !== -1 ||
            msg.indexOf('ResizeObserver') !== -1 ||
            msg.indexOf('WebGL') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('failed to connect') !== -1 ||
            msg.indexOf('ResizeObserver') !== -1 ||
            msg.indexOf('WebGL') !== -1 ||
            msg.indexOf('CONTEXT_LOST_WEBGL') !== -1 ||
            msg.indexOf('context lost') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
